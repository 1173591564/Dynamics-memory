<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bike</title>
<style>
  /* ---- 全部样式手写内联：无外链、无字体文件、无网络请求 ---- */
  :root{
    --ink:#20293a;
    --paper:#fffdf6;
    --accent:#e2543f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(12px,3vw,36px);
    background:
      radial-gradient(1100px 620px at 50% -12%, #fff8e6 0%, #ffe7c2 45%, #f3d3ae 100%);
    font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",
                system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
  }
  .card{
    width:min(1280px,100%);
    border-radius:28px;
    overflow:hidden;
    background:#101d28;
    border:1px solid rgba(255,255,255,.65);
    box-shadow:0 34px 70px -26px rgba(70,44,18,.55),
               0 2px 0 rgba(255,255,255,.8) inset;
  }
  canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0f1b25}
  .bar{
    display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;
    padding:14px 18px;background:var(--paper);border-top:6px solid #f0c060;
  }
  .bar h1{margin:0;font-size:clamp(15px,2.1vw,20px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar p{margin:3px 0 0;font-size:12px;opacity:.6;
         font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tag{
    font-size:12px;padding:4px 11px;border-radius:999px;
    background:var(--ink);color:#fff6e2;letter-spacing:.03em;white-space:nowrap;
  }
  .ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:14px}
  .ctl label{display:flex;align-items:center;gap:7px;white-space:nowrap}
  button{
    font:inherit;font-size:14px;min-width:74px;padding:8px 15px;border-radius:999px;
    border:2px solid var(--ink);background:#ffd98a;cursor:pointer;
    box-shadow:0 3px 0 var(--ink);
  }
  button:hover{background:#ffe6ad}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  input[type=range]{width:104px;accent-color:var(--accent)}
  output{font-variant-numeric:tabular-nums;font-size:13px;opacity:.75;min-width:3.2em}
</style>
</head>
<body>
<main class="card">
  <canvas id="scene" width="1280" height="720"
          role="img" aria-label="一只鹈鹕骑着自行车经过乡村小路的动画"></canvas>

  <div class="bar">
    <div>
      <h1>鹈鹕骑自行车<span class="tag">纯手写 HTML + Canvas 2D · 零依赖 · 可离线</span></h1>
      <p>one file · no libraries · no fonts · no network · ~700 lines of hand-drawn vector code</p>
    </div>
    <div class="ctl">
      <button id="toggle" type="button">暂停</button>
      <label>车速<input id="speed" type="range" min="0.2" max="2.2" step="0.05" value="1"><output id="speedOut">1.00×</output></label>
      <label>踏频<input id="cad" type="range" min="0.5" max="2" step="0.05" value="1.15"><output id="cadOut">1.15 Hz</output></label>
    </div>
  </div>
</main>

<script>
/* =====================================================================
   鹈鹕骑自行车  —  100% 手写 Canvas 2D 场景，无第三方库、无外部资源。
   结构：
     state / advance(dt)  时间积分（浏览器与截图脚本共用同一条代码路径）
     drawScene(ctx)       一帧的全部绘制
     mount()              仅在浏览器里执行（rAF 循环 + 控件绑定）
   ===================================================================== */
'use strict';

var W = 1280, H = 720;            // 逻辑分辨率（CSS 像素）
var HORIZON = 400;                // 地平线
var ROAD_TOP = 522;               // 路面远端
var GROUND = 600;                 // 车轮接地点
var R_WHEEL = 88;                 // 车轮半径 px  (≈34cm)
var PX_PER_CM = 2.6;              // 比例尺
var SPEED = 700;                  // 世界滚动速度 px/s
var CAD_BASE = 1.15;              // 基准踏频 rev/s
var BIKE_X = 600;                 // 后轴 x

var TAU = Math.PI * 2;

var state = {
  t: 0,          // 累计时间 s
  dist: 0,       // 累计行进距离 px
  crank: 0,      // 曲柄相位 rad
  spin: 0,       // 车轮相位 rad
  speed: 1,      // 车速倍率
  cadence: CAD_BASE,
  playing: true
};

function advance(dt) {
  if (state.playing) {
    state.t += dt;
    state.dist += SPEED * state.speed * dt;
    state.crank += TAU * state.cadence * dt;
  }
  state.spin = state.dist / R_WHEEL;
}

function reset() { state.t = 0; state.dist = 0; state.crank = 0; state.spin = 0; }
function kmh() { return (SPEED * state.speed) / PX_PER_CM * 0.01 * 3.6; }

/* ----------------------------- 小工具 ----------------------------- */
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function wrap(x, m) { return ((x % m) + m) % m; }
function rr(ctx, x, y, w, h, r) {                 // 圆角矩形（自己实现，不依赖 roundRect）
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function tube(ctx, pts, w, color, alpha) {        // 带描边的管件
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineWidth = w + 5;
  ctx.strokeStyle = 'rgba(24,31,42,' + (alpha == null ? 0.55 : alpha) + ')';
  ctx.stroke();
  ctx.lineWidth = w;
  ctx.strokeStyle = color;
  ctx.stroke();
}
function shadowOn(ctx, blur, dy, color) {
  ctx.shadowColor = color || 'rgba(30,38,50,.28)';
  ctx.shadowBlur = blur; ctx.shadowOffsetY = dy;
}
function shadowOff(ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }

/* ============================== 背景 ============================== */
function drawSky(ctx) {
  var g = ctx.createLinearGradient(0, 0, 0, ROAD_TOP);
  g.addColorStop(0, '#63b4e2');
  g.addColorStop(0.45, '#a9d8ec');
  g.addColorStop(0.78, '#ffe3b4');
  g.addColorStop(1, '#ffd39a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, ROAD_TOP + 2);
}

function drawSun(ctx, t) {
  var x = 1064, y = 132, r = 52;
  var pulse = 1 + Math.sin(t * 0.7) * 0.03;
  var g = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 5.2);
  g.addColorStop(0, 'rgba(255,240,190,.85)');
  g.addColorStop(0.35, 'rgba(255,214,140,.28)');
  g.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 5.2, 0, TAU); ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t * 0.06);
  ctx.strokeStyle = 'rgba(255,247,214,.55)';
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (var i = 0; i < 12; i++) {
    var a = i / 12 * TAU, r1 = r * 1.35 * pulse, r2 = r * (i % 2 ? 1.62 : 1.95) * pulse;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.stroke();
  }
  ctx.restore();

  var d = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.15, x, y, r);
  d.addColorStop(0, '#fffdf0');
  d.addColorStop(1, '#ffd778');
  ctx.fillStyle = d;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}

function puff(ctx, x, y, s, tint) {
  var blobs = [[-38, 6, 26], [-12, -12, 34], [18, -6, 28], [40, 8, 22], [6, 14, 26]];
  ctx.beginPath();
  for (var i = 0; i < blobs.length; i++) {
    var b = blobs[i];
    ctx.moveTo(x + b[0] * s + b[2] * s, y + b[1] * s);
    ctx.arc(x + b[0] * s, y + b[1] * s, b[2] * s, 0, TAU);
  }
  ctx.fillStyle = tint || 'rgba(255,255,255,.92)';
  ctx.fill();
}

function drawClouds(ctx, dist) {
  var clouds = [
    [180, 96, 1.05, 0.10], [620, 62, 0.8, 0.16], [980, 118, 1.25, 0.07],
    [1330, 78, 0.9, 0.13], [420, 158, 0.62, 0.22], [1180, 180, 0.7, 0.19]
  ];
  var span = W + 520;
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var x = wrap(c[0] - dist * c[3], span) - 260;
    var y = c[1] + Math.sin(state.t * 0.4 + i) * 3;
    puff(ctx, x, y + 12, c[2] * 1.02, 'rgba(190,214,232,.35)');
    puff(ctx, x, y, c[2], 'rgba(255,255,255,.93)');
  }
}

function drawBirds(ctx, dist) {
  var birds = [[0.13, 120, 0.9], [0.2, 150, 0.75], [0.26, 104, 0.6]];
  for (var i = 0; i < birds.length; i++) {
    var b = birds[i];
    var x = wrap(1180 - dist * b[0] + i * 90, W + 260) - 130;
    var y = b[1] + Math.sin(state.t * 1.1 + i * 2) * 9;
    var f = Math.sin(state.t * 6 + i * 1.7) * 0.5;      // 翅膀扑动
    var s = 13 * b[2];
    ctx.strokeStyle = 'rgba(52,66,80,.6)';
    ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s, y + f * s * 0.7);
    ctx.quadraticCurveTo(x - s * 0.4, y - f * s * 0.5, x, y);
    ctx.quadraticCurveTo(x + s * 0.4, y - f * s * 0.5, x + s, y + f * s * 0.7);
    ctx.stroke();
  }
}

function hillY(x, base, amp, k1, k2, off) {
  return base
    - Math.sin((x + off) * 0.0042 * k1) * amp
    - Math.sin((x + off) * 0.0017 * k2 + 1.3) * amp * 0.55;
}
function hillPath(ctx, base, amp, k1, k2, off) {
  ctx.beginPath();
  ctx.moveTo(-10, H);
  ctx.lineTo(-10, hillY(-10, base, amp, k1, k2, off));
  for (var x = -10; x <= W + 10; x += 14) ctx.lineTo(x, hillY(x, base, amp, k1, k2, off));
  ctx.lineTo(W + 10, H);
  ctx.closePath();
}

function drawHills(ctx, dist) {
  hillPath(ctx, 372, 34, 1.0, 1.0, dist * 0.05);
  ctx.fillStyle = '#a9c4d8'; ctx.fill();

  hillPath(ctx, 402, 26, 1.7, 0.8, dist * 0.11);
  ctx.fillStyle = '#93b8a0'; ctx.fill();
}

function drawTreeLine(ctx, dist) {
  // 树固定在世界坐标里，且正好落在中层山丘的轮廓线上
  var span = 210, off = dist * 0.11;
  var i0 = Math.floor((off - 60) / span), i1 = Math.ceil((off + W + 60) / span);
  for (var i = i0; i <= i1; i++) {
    var x = i * span - off;
    var base = hillY(i * span, 402, 26, 1.7, 0.8, off) + 4;
    var s = 0.85 + (((i * 37) % 5 + 5) % 5) / 12;
    ctx.strokeStyle = 'rgba(96,74,52,.9)';           // 树干
    ctx.lineWidth = 4 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, base + 2); ctx.lineTo(x, base - 16 * s); ctx.stroke();
    ctx.fillStyle = 'rgba(88,112,84,.95)';           // 树冠
    ctx.beginPath();
    ctx.arc(x, base - 30 * s, 16 * s, 0, TAU);
    ctx.arc(x - 10 * s, base - 20 * s, 11 * s, 0, TAU);
    ctx.arc(x + 10 * s, base - 20 * s, 11 * s, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.ellipse(x - 6 * s, base - 32 * s, 6 * s, 8 * s, -0.3, 0, TAU); ctx.fill();
  }
}

function drawPoles(ctx, dist) {
  var span = 430;
  for (var i = -1; i < W / span + 2; i++) {
    var x = i * span - wrap(dist * 0.55, span);
    if (x < -80 || x > W + 80) continue;
    ctx.strokeStyle = '#6d5a48'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, ROAD_TOP + 4); ctx.lineTo(x, 214); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x - 26, 232); ctx.lineTo(x + 26, 232); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 18, 254); ctx.lineTo(x + 18, 254); ctx.stroke();
    // 电线（悬链线近似）
    ctx.strokeStyle = 'rgba(70,62,58,.55)'; ctx.lineWidth = 2;
    for (var k = 0; k < 2; k++) {
      var yy = k ? 254 : 232, half = k ? 18 : 26;
      ctx.beginPath();
      ctx.moveTo(x - half, yy);
      ctx.quadraticCurveTo(x - half - span / 2, yy + 26, x - half - span, yy);
      ctx.stroke();
    }
  }
}

/* ============================== 路面 ============================== */
function drawRoad(ctx, dist) {
  // 路肩草地
  var g0 = ctx.createLinearGradient(0, ROAD_TOP - 40, 0, ROAD_TOP + 18);
  g0.addColorStop(0, '#8fb96f');
  g0.addColorStop(1, '#6f9c55');
  ctx.fillStyle = g0;
  ctx.fillRect(0, ROAD_TOP - 40, W, 62);

  // 沥青
  var g = ctx.createLinearGradient(0, ROAD_TOP, 0, H);
  g.addColorStop(0, '#787d84');
  g.addColorStop(0.35, '#5f646b');
  g.addColorStop(1, '#454a51');
  ctx.fillStyle = g;
  ctx.fillRect(0, ROAD_TOP + 16, W, H - ROAD_TOP);

  // 远端白实线
  ctx.fillStyle = 'rgba(246,240,222,.75)';
  ctx.fillRect(0, ROAD_TOP + 26, W, 5);

  // 中央虚线
  var span = 190, dash = 96;
  ctx.fillStyle = 'rgba(250,238,200,.9)';
  for (var i = -1; i < W / span + 2; i++) {
    var x = i * span - wrap(dist, span);
    ctx.save();
    ctx.transform(1, 0, -0.14, 1, 0, 0);
    rr(ctx, x + 0.14 * 646, 640, dash, 12, 6);
    ctx.fill();
    ctx.restore();
  }

  // 路面纹理颗粒
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for (var p = 0; p < 46; p++) {
    var seed = p * 97.13;
    var px = wrap(seed * 7.7 - dist * (0.9 + (p % 4) * 0.08), W + 60) - 30;
    var py = ROAD_TOP + 50 + ((seed * 3.3) % (H - ROAD_TOP - 60));
    var r = 1 + (p % 3);
    ctx.beginPath(); ctx.ellipse(px, py, r * 2.4, r, 0, 0, TAU); ctx.fill();
  }
}

function drawRoadside(ctx, dist) {
  // 近处草丛与小花（前景，滚动更快）
  var span = 132;
  for (var i = -1; i < W / span + 2; i++) {
    var x = i * span - wrap(dist * 1.55, span);
    var y = H - 26 - ((i * 53) % 22);
    var sway = Math.sin(state.t * 2.4 + i) * 4;
    ctx.strokeStyle = '#4e7f43'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (var b = -2; b <= 2; b++) {
      ctx.beginPath();
      ctx.moveTo(x + b * 7, y + 30);
      ctx.quadraticCurveTo(x + b * 7 + sway, y + 6, x + b * 9 + sway * 1.8, y - 12);
      ctx.stroke();
    }
    if (i % 2 === 0) {
      ctx.fillStyle = i % 4 === 0 ? '#f4d35e' : '#ef7d94';
      ctx.beginPath(); ctx.arc(x + sway * 1.8, y - 15, 5.5, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(x + sway * 1.8, y - 15, 2, 0, TAU); ctx.fill();
    }
  }
}

/* ============================== 自行车 ============================== */
// 车架关键点（局部坐标：原点=后轴，y 向下）
var WB = 300;                     // 轴距
var BB = [118, 20];               // 中轴
var SEAT_TOP = [74, -158];
var HEAD_TOP = [258, -150];
var HEAD_BOT = [272, -92];
var CRANK_R = 46;

function wheel(ctx, x, y, r, spin, dark) {
  ctx.save();
  ctx.translate(x, y);
  // 外胎
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
  ctx.lineWidth = 17;
  ctx.strokeStyle = dark ? '#191d23' : '#23272e';
  ctx.stroke();
  // 轮圈
  ctx.beginPath(); ctx.arc(0, 0, r - 10, 0, TAU);
  ctx.lineWidth = 6;
  ctx.strokeStyle = dark ? '#a8b1bb' : '#d3dae1';
  ctx.stroke();
  ctx.save();
  ctx.rotate(spin);
  // 辐条
  ctx.strokeStyle = 'rgba(226,232,238,.8)';
  ctx.lineWidth = 2;
  for (var i = 0; i < 14; i++) {
    var a = i / 14 * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
    ctx.lineTo(Math.cos(a) * (r - 12), Math.sin(a) * (r - 12));
    ctx.stroke();
  }
  // 气嘴（用来肉眼确认轮子在转）
  ctx.fillStyle = '#f0c060';
  ctx.beginPath(); ctx.arc(0, -(r - 12), 3.6, 0, TAU); ctx.fill();
  ctx.restore();
  // 花鼓
  ctx.fillStyle = dark ? '#6c7681' : '#98a2ad';
  ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3f4750';
  ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, TAU); ctx.fill();
  // 高光
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, r, -2.3, -1.2); ctx.stroke();
  ctx.restore();
}

function drawBikeFrame(ctx) {
  var frame = '#e2543f';
  // 后三角 + 前三角
  tube(ctx, [[0, 0], BB], 9, '#c9402f');            // 下后叉
  tube(ctx, [[0, 0], [SEAT_TOP[0] + 4, SEAT_TOP[1] + 6]], 8, '#c9402f');  // 上后叉
  tube(ctx, [BB, SEAT_TOP], 11, frame);              // 座管
  tube(ctx, [[SEAT_TOP[0] + 6, SEAT_TOP[1] + 2], [HEAD_TOP[0] - 4, HEAD_TOP[1] + 2]], 10, frame); // 上管
  tube(ctx, [HEAD_BOT, BB], 12, frame);              // 下管
  tube(ctx, [HEAD_TOP, HEAD_BOT], 14, frame);        // 头管
  // 前叉
  tube(ctx, [HEAD_BOT, [WB, 0]], 8, '#c9402f');
  // 把立 + 弯把
  tube(ctx, [HEAD_TOP, [286, -160]], 9, '#39414d');
  ctx.save();
  tube(ctx, [[286, -160], [308, -150], [312, -122], [292, -108]], 8, '#39414d');
  ctx.restore();
  // 车座
  ctx.save();
  ctx.translate(SEAT_TOP[0], SEAT_TOP[1]);
  ctx.rotate(-0.08);
  ctx.beginPath();
  ctx.moveTo(-30, -4);
  ctx.quadraticCurveTo(-4, -14, 34, -6);
  ctx.quadraticCurveTo(40, 0, 30, 6);
  ctx.quadraticCurveTo(-6, 12, -30, 6);
  ctx.closePath();
  ctx.fillStyle = '#2b313b'; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); ctx.ellipse(4, -6, 20, 3.4, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawDrivetrain(ctx, near) {
  // 链条
  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(BB[0], BB[1] - 26); ctx.lineTo(4, -10);
  ctx.moveTo(BB[0], BB[1] + 26); ctx.lineTo(4, 10);
  ctx.stroke();
  // 后飞轮
  ctx.fillStyle = '#6f7883';
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill();
  // 牙盘
  ctx.fillStyle = '#b9c1cb';
  ctx.beginPath(); ctx.arc(BB[0], BB[1], 27, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7d8794';
  for (var i = 0; i < 10; i++) {
    var a = i / 10 * TAU + state.crank;
    ctx.beginPath();
    ctx.arc(BB[0] + Math.cos(a) * 19, BB[1] + Math.sin(a) * 19, 3, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = '#4b545f';
  ctx.beginPath(); ctx.arc(BB[0], BB[1], 8, 0, TAU); ctx.fill();

  // 曲柄 + 脚踏
  var a2 = state.crank + (near ? 0 : Math.PI);
  var px = BB[0] + Math.cos(a2) * CRANK_R, py = BB[1] + Math.sin(a2) * CRANK_R;
  tube(ctx, [BB, [px, py]], 9, near ? '#39414d' : '#252b34');
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(Math.sin(a2) * 0.12);
  rr(ctx, -16, -5, 32, 11, 4);
  ctx.fillStyle = near ? '#4b545f' : '#2f353e';
  ctx.fill();
  ctx.restore();
  return [px, py];
}

/* ============================== 鹈鹕 ============================== */
var HIP = [104, -164];
var THIGH = 112, SHIN = 118;   // 大腿/小腿长，匹配踏板行程
var SHOULDER = [176, -250];

function legIK(ctx, hip, foot, l1, l2, sign, w, color) {
  var dx = foot[0] - hip[0], dy = foot[1] - hip[1];
  var d = Math.hypot(dx, dy);
  d = clamp(d, Math.abs(l1 - l2) + 1, l1 + l2 - 1);
  var a = Math.atan2(dy, dx);
  var c = clamp((d * d + l1 * l1 - l2 * l2) / (2 * d * l1), -1, 1);
  var ang = a + sign * Math.acos(c);
  var knee = [hip[0] + Math.cos(ang) * l1, hip[1] + Math.sin(ang) * l1];
  tube(ctx, [hip, knee], w, color, 0.42);
  tube(ctx, [knee, foot], w - 2, color, 0.42);
  return knee;
}

function webFoot(ctx, p, tilt, color) {
  ctx.save();
  ctx.translate(p[0], p[1]);
  ctx.rotate(tilt);
  ctx.beginPath();
  ctx.moveTo(-4, -7);
  ctx.quadraticCurveTo(24, -9, 30, 2);
  ctx.quadraticCurveTo(20, 9, -2, 8);
  ctx.quadraticCurveTo(-12, 4, -4, -7);
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = 'rgba(150,86,20,.5)'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.beginPath();                                   // 趾间蹼纹
  ctx.moveTo(6, -2); ctx.lineTo(24, 0);
  ctx.moveTo(5, 2); ctx.lineTo(22, 4);
  ctx.stroke();
  ctx.restore();
}

function drawPelican(ctx, pedalFar, kneeSign) {
  var t = state.t;
  var bob = Math.sin(state.crank * 2) * 3;          // 骑行颠簸
  var lean = Math.sin(state.crank * 2 + 0.7) * 0.012;
  var jiggle = Math.sin(state.crank * 2 + 1.1) * 4; // 喉囊晃动

  ctx.save();
  ctx.translate(0, bob);
  ctx.rotate(lean);

  /* --- 远侧腿（在车架后面） --- */
  legIK(ctx, HIP, pedalFar, 84, 92, kneeSign, 17, '#d9cfc0');
  webFoot(ctx, pedalFar, Math.sin(state.crank + Math.PI) * 0.14, '#d99a3c');

  /* --- 尾羽 --- */
  ctx.save();
  ctx.fillStyle = '#e8e2d6';
  ctx.strokeStyle = 'rgba(120,112,98,.35)';
  ctx.lineWidth = 2;
  for (var f = 0; f < 4; f++) {
    var fa = -0.42 + f * 0.22 + Math.sin(t * 2 + f) * 0.03;
    ctx.save();
    ctx.translate(66, -196);
    ctx.rotate(fa);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-40, -10, -74, 4);
    ctx.quadraticCurveTo(-40, 12, 0, 12);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  /* --- 身体 --- */
  shadowOn(ctx, 16, 8);
  ctx.beginPath();
  ctx.moveTo(58, -198);
  ctx.bezierCurveTo(76, -272, 152, -292, 192, -256);
  ctx.bezierCurveTo(218, -232, 208, -184, 168, -158);
  ctx.bezierCurveTo(128, -132, 82, -150, 64, -174);
  ctx.closePath();
  var bg = ctx.createLinearGradient(80, -290, 190, -140);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(0.55, '#f6f2e9');
  bg.addColorStop(1, '#ded8cb');
  ctx.fillStyle = bg; ctx.fill();
  shadowOff(ctx);
  ctx.strokeStyle = 'rgba(122,114,100,.5)'; ctx.lineWidth = 3; ctx.stroke();

  // 腹部阴影 + 羽毛纹
  ctx.save();
  ctx.clip();
  ctx.fillStyle = 'rgba(190,182,166,.35)';
  ctx.beginPath(); ctx.ellipse(128, -152, 62, 26, -0.18, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(160,152,136,.5)'; ctx.lineWidth = 2.2;
  for (var q = 0; q < 3; q++) {
    ctx.beginPath();
    ctx.moveTo(96 + q * 26, -212 + q * 6);
    ctx.quadraticCurveTo(112 + q * 26, -196 + q * 6, 96 + q * 26 + 22, -192 + q * 6);
    ctx.stroke();
  }
  ctx.restore();

  /* --- 翅膀（远侧一点影子） --- */
  ctx.fillStyle = 'rgba(176,168,152,.55)';
  ctx.beginPath();
  ctx.moveTo(168, -244);
  ctx.quadraticCurveTo(120, -214, 96, -190);
  ctx.quadraticCurveTo(140, -206, 172, -224);
  ctx.closePath(); ctx.fill();

  /* --- 脖子 --- */
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(SHOULDER[0] - 6, SHOULDER[1] + 6);
  ctx.quadraticCurveTo(214, -286, 216, -300);
  ctx.lineWidth = 40; ctx.strokeStyle = 'rgba(122,114,100,.45)'; ctx.stroke();
  ctx.lineWidth = 34; ctx.strokeStyle = '#fbf8f1'; ctx.stroke();
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke();

  /* --- 围巾 --- */
  var sway = Math.sin(t * 3.1) * 10;
  ctx.beginPath();
  ctx.moveTo(196, -272);
  ctx.quadraticCurveTo(150, -262 + sway * 0.4, 108, -274 + sway);
  ctx.quadraticCurveTo(96, -276 + sway, 88, -268 + sway * 1.2);
  ctx.lineTo(96, -252 + sway * 1.2);
  ctx.quadraticCurveTo(120, -252 + sway * 0.7, 152, -246 + sway * 0.3);
  ctx.quadraticCurveTo(180, -244, 200, -254);
  ctx.closePath();
  ctx.fillStyle = '#e2543f'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,40,28,.45)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.ellipse(150, -262 + sway * 0.5, 18, 5, 0.1, 0, TAU); ctx.fill();

  /* --- 头 --- */
  var hx = 222, hy = -308 + Math.sin(state.crank * 2 + 0.4) * 2;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(0.06);

  // 叼着的鱼（先画，鱼身被上喙盖住，鱼尾从喙尖探出来）
  ctx.save();
  ctx.translate(106, -14 + jiggle * 0.3);
  ctx.rotate(0.06 + Math.sin(t * 5) * 0.05);
  ctx.fillStyle = '#5f9ec9';
  ctx.beginPath();
  ctx.moveTo(26, 0);
  ctx.quadraticCurveTo(2, -13, -20, -2);
  ctx.quadraticCurveTo(2, 12, 26, 0);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();                                   // 鱼尾（朝喙尖方向）
  ctx.moveTo(24, 0); ctx.lineTo(44, -12); ctx.lineTo(38, 0); ctx.lineTo(44, 12);
  ctx.closePath(); ctx.fillStyle = '#4b87b0'; ctx.fill();
  ctx.restore();

  // 上喙
  ctx.beginPath();
  ctx.moveTo(6, -16);
  ctx.quadraticCurveTo(70, -30, 134, -14);
  ctx.quadraticCurveTo(140, -10, 134, -6);
  ctx.quadraticCurveTo(70, -6, 8, -2);
  ctx.closePath();
  var beg = ctx.createLinearGradient(0, -26, 130, 0);
  beg.addColorStop(0, '#f7c356');
  beg.addColorStop(1, '#ef972c');
  ctx.fillStyle = beg; ctx.fill();
  ctx.strokeStyle = 'rgba(160,96,20,.55)'; ctx.lineWidth = 2; ctx.stroke();

  // 喉囊
  ctx.beginPath();
  ctx.moveTo(8, -4);
  ctx.quadraticCurveTo(30, 42 + jiggle, 84, 34 + jiggle * 0.8);
  ctx.quadraticCurveTo(124, 26 + jiggle * 0.6, 134, -6);
  ctx.quadraticCurveTo(70, 6, 8, -4);
  ctx.closePath();
  var pg = ctx.createLinearGradient(0, -6, 90, 40);
  pg.addColorStop(0, '#fbd79a');
  pg.addColorStop(1, '#f2b06a');
  ctx.fillStyle = pg; ctx.fill();
  ctx.strokeStyle = 'rgba(178,110,40,.45)'; ctx.lineWidth = 2; ctx.stroke();

  // 颅部
  ctx.beginPath();
  ctx.moveTo(-24, -6);
  ctx.bezierCurveTo(-34, -34, -10, -50, 12, -42);
  ctx.bezierCurveTo(30, -36, 32, -14, 14, -2);
  ctx.closePath();
  var hg = ctx.createLinearGradient(-20, -48, 20, 0);
  hg.addColorStop(0, '#ffffff');
  hg.addColorStop(1, '#e7e1d4');
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = 'rgba(122,114,100,.5)'; ctx.lineWidth = 2.6; ctx.stroke();

  // 眼
  var blink = wrap(t, 4.6) < 0.13;
  ctx.fillStyle = '#22283a';
  if (blink) {
    ctx.strokeStyle = '#22283a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-2, -26); ctx.quadraticCurveTo(6, -21, 14, -26); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(6, -25, 6.4, 7.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(8.4, -27.4, 2.3, 0, TAU); ctx.fill();
  }
  // 眉
  ctx.strokeStyle = 'rgba(90,84,74,.6)'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(-2, -35); ctx.quadraticCurveTo(6, -39, 14, -35); ctx.stroke();

  // 小圆眼镜/帽
  ctx.save();
  ctx.rotate(-0.12);
  ctx.fillStyle = '#2f6fb2';
  ctx.beginPath();
  ctx.moveTo(-28, -34);
  ctx.quadraticCurveTo(-20, -62, 12, -58);
  ctx.quadraticCurveTo(24, -56, 24, -40);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#255a92';
  ctx.beginPath();
  ctx.moveTo(20, -44);
  ctx.quadraticCurveTo(48, -46, 56, -38);
  ctx.quadraticCurveTo(42, -32, 20, -36);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.ellipse(-6, -48, 11, 5, -0.25, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.restore();  // 头

  /* --- 近侧翅膀（搭在车把上） --- */
  var flap = Math.sin(state.crank * 2 + 0.5) * 4;
  function wingPath() {
    ctx.beginPath();
    ctx.moveTo(SHOULDER[0] - 4, SHOULDER[1] - 4);
    ctx.bezierCurveTo(214, -226 + flap, 250, -188 + flap, 282, -152);
    ctx.quadraticCurveTo(292, -140, 278, -138);
    ctx.bezierCurveTo(244, -152 + flap, 206, -186 + flap, 172, -216);
    ctx.quadraticCurveTo(158, -228, SHOULDER[0] - 4, SHOULDER[1] - 4);
    ctx.closePath();
  }
  ctx.save();
  shadowOn(ctx, 10, 5, 'rgba(90,80,64,.25)');
  wingPath();
  var wg = ctx.createLinearGradient(160, -250, 290, -140);
  wg.addColorStop(0, '#ffffff');
  wg.addColorStop(1, '#e3ddd0');
  ctx.fillStyle = wg; ctx.fill();
  shadowOff(ctx);
  ctx.strokeStyle = 'rgba(122,114,100,.55)'; ctx.lineWidth = 2.8; ctx.stroke();
  // 飞羽（裁剪在翅膀内）
  ctx.save();
  wingPath();
  ctx.clip();
  ctx.strokeStyle = 'rgba(150,142,126,.75)'; ctx.lineWidth = 2.2;
  for (var wI = 0; wI < 4; wI++) {
    var k = wI / 3;
    ctx.beginPath();
    ctx.moveTo(lerp(196, 262, k), lerp(-212, -158, k) + flap * (1 - k));
    ctx.quadraticCurveTo(lerp(224, 280, k), lerp(-186, -142, k) + flap * (1 - k) * 0.6,
                         lerp(246, 288, k), lerp(-166, -136, k));
    ctx.stroke();
  }
  ctx.restore();   // 飞羽裁剪
  ctx.restore();   // 翅膀外层 save
  ctx.restore();   // bob
}

/* ============================== 尘土 & 速度线 ============================== */
function drawDust(ctx, rearX, rearY) {
  for (var i = 0; i < 7; i++) {
    var age = wrap(state.dist / 150 + i / 7, 1);
    var x = rearX - age * 190;
    var y = rearY - 6 - age * 26 + Math.sin(i * 2.1) * 8;
    var r = 6 + age * 26;
    ctx.fillStyle = 'rgba(226,214,190,' + (0.34 * (1 - age)).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  // 小石子
  for (var s = 0; s < 3; s++) {
    var a2 = wrap(state.dist / 90 + s / 3, 1);
    var sx = rearX - a2 * 120, sy = rearY - 4 - a2 * 34;
    ctx.fillStyle = 'rgba(120,112,100,' + (0.5 * (1 - a2)).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(sx, sy, 2.6, 0, TAU); ctx.fill();
  }
}

function drawSpeedLines(ctx, t) {
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (var i = 0; i < 5; i++) {
    var y = 250 + i * 62;
    var x = wrap(W + 120 - state.dist * (1.5 + i * 0.12) + i * 137, W + 260) - 130;
    ctx.globalAlpha = 0.5 - i * 0.06;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 58 + i * 12, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ============================== 标题 ============================== */
function drawTitle(ctx, t) {
  ctx.save();
  ctx.font = '700 72px "ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textBaseline = 'alphabetic';
  var title = '鹈鹕骑自行车';
  var x = 58, y = 120, gap = 7;
  var dip = Math.sin(t * 1.6) * 3;
  var widths = [], total = 0, i;
  for (i = 0; i < title.length; i++) {
    widths[i] = ctx.measureText(title[i]).width;
    total += widths[i] + gap;
  }
  ctx.save();
  ctx.translate(0, dip);
  ctx.lineJoin = 'round';
  ctx.lineWidth = 7;
  var cx = x, pass;
  for (pass = 0; pass < 2; pass++) {        // 先整体描边、再整体填充
    cx = x;
    for (i = 0; i < title.length; i++) {
      if (pass === 0) { ctx.strokeStyle = 'rgba(32,41,58,.85)'; ctx.strokeText(title[i], cx, y); }
      else {
        var g = ctx.createLinearGradient(cx, y - 66, cx, y + 8);
        g.addColorStop(0, '#fffdf4');
        g.addColorStop(1, '#ffe6b0');
        ctx.fillStyle = g;
        ctx.fillText(title[i], cx, y);
      }
      cx += widths[i] + gap;
    }
  }
  ctx.restore();

  ctx.font = '600 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  ctx.fillStyle = 'rgba(32,41,58,.62)';
  ctx.fillText('pelican on a bike · hand-written canvas 2d · zero dependencies', x + 4, 150);

  // 速度牌
  var v = kmh(), box = 186;
  ctx.save();
  ctx.translate(W - box - 46, H - 104);
  rr(ctx, 0, 0, box, 64, 16);
  ctx.fillStyle = 'rgba(32,41,58,.72)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,246,226,.5)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff6e2';
  ctx.font = '700 31px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign = 'right';
  ctx.fillText(v.toFixed(1), box - 70, 50);
  ctx.font = '600 17px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillText('km/h', box - 16, 50);
  ctx.textAlign = 'left';
  ctx.font = '600 13px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle = 'rgba(255,246,226,.62)';
  ctx.fillText('cadence ' + state.cadence.toFixed(2) + ' Hz', 16, 24);
  ctx.restore();
  ctx.restore();
}

function drawVignette(ctx) {
  var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 1.02);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(28,20,10,.34)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ============================== 一帧 ============================== */
function drawScene(ctx) {
  var t = state.t;
  ctx.save();
  ctx.clearRect(0, 0, W, H);

  drawSky(ctx);
  drawSun(ctx, t);
  drawClouds(ctx, state.dist);
  drawBirds(ctx, state.dist);
  drawHills(ctx, state.dist);
  drawTreeLine(ctx, state.dist);
  drawPoles(ctx, state.dist);
  drawRoad(ctx, state.dist);
  drawSpeedLines(ctx, t);

  // 自行车 + 骑手（局部坐标：原点在后轴）
  var bob = Math.sin(state.crank * 2) * 2.2;
  var tilt = Math.sin(state.crank * 2 + 0.6) * 0.009;

  // 地面投影
  ctx.save();
  ctx.fillStyle = 'rgba(30,34,40,.3)';
  ctx.beginPath();
  ctx.ellipse(BIKE_X + WB * 0.44, GROUND + 12, 232, 20, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(BIKE_X, GROUND - R_WHEEL + bob);
  ctx.rotate(tilt);

  drawDust(ctx, 0, R_WHEEL - 4);
  wheel(ctx, 0, 0, R_WHEEL, state.spin, true);        // 后轮（远侧，略暗）
  wheel(ctx, WB, 0, R_WHEEL, state.spin, false);      // 前轮
  drawBikeFrame(ctx);
  var pedalFar = drawDrivetrain(ctx, false);
  drawPelican(ctx, pedalFar, -1);                     // 身体 + 远侧腿
  var pedalNear = drawDrivetrain(ctx, true);
  drawNearLeg(ctx, pedalNear, -1);                    // 近侧腿压在最上层
  ctx.restore();

  drawRoadside(ctx, state.dist);
  drawTitle(ctx, t);
  drawVignette(ctx);
  ctx.restore();
}

// 近侧腿单独重画一次，保证脚踏不被车架遮住（与 pelican 内部用同一套 IK）
function drawNearLeg(ctx, pedal, kneeSign) {
  var bob = Math.sin(state.crank * 2) * 3;
  var lean = Math.sin(state.crank * 2 + 0.7) * 0.012;
  ctx.save();
  ctx.rotate(lean);
  ctx.translate(0, bob);
  var knee = legIK(ctx, HIP, pedal, THIGH, SHIN, kneeSign, 18, '#fffdf7');
  ctx.fillStyle = 'rgba(190,182,166,.35)';
  ctx.beginPath(); ctx.arc(knee[0], knee[1], 12, 0, TAU); ctx.fill();
  webFoot(ctx, pedal, Math.sin(state.crank) * 0.14, '#f0a63c');
  ctx.restore();
}

/* ============================== 浏览器装配 ============================== */
function mount() {
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);

  var last = 0;
  function frame(now) {
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
    last = now;
    advance(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawScene(ctx);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var btn = document.getElementById('toggle');
  var sp = document.getElementById('speed');
  var cd = document.getElementById('cad');
  var spOut = document.getElementById('speedOut');
  var cdOut = document.getElementById('cadOut');

  function sync() {
    spOut.textContent = state.speed.toFixed(2) + '×';
    cdOut.textContent = state.cadence.toFixed(2) + ' Hz';
    btn.textContent = state.playing ? '暂停' : '继续';
  }
  btn.addEventListener('click', function () { state.playing = !state.playing; sync(); });
  sp.addEventListener('input', function () { state.speed = parseFloat(sp.value); sync(); });
  cd.addEventListener('input', function () { state.cadence = parseFloat(cd.value); sync(); });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); state.playing = !state.playing; sync(); }
  });
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    state.playing = false;
  }
  sync();
}

/* ============================== 导出 ============================== */
var PEPEN = {
  W: W, H: H, state: state,
  advance: advance, drawScene: drawScene, reset: reset, kmh: kmh
};
if (typeof globalThis !== 'undefined') globalThis.PEPEN = PEPEN;
if (typeof document !== 'undefined' && typeof requestAnimationFrame !== 'undefined') mount();
</script>

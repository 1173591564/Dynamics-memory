<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican Cycling</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 28px 16px;
    background: radial-gradient(1200px 700px at 50% -10%, #24405c 0%, #16283c 45%, #0d1725 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: #eaf2f8;
  }
  .stage { width: min(1180px, 100%); }
  header { text-align: center; margin-bottom: 18px; }
  h1 {
    margin: 0 0 6px; font-size: clamp(26px, 4vw, 40px); letter-spacing: .12em;
    background: linear-gradient(92deg, #ffe9a8, #8fe3d8 60%, #ffd166);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 0; color: #9fb4c8; font-size: 14px; letter-spacing: .18em; }
  .card {
    margin: 0; border-radius: 22px; overflow: hidden; line-height: 0;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  }
  .card svg { width: 100%; height: auto; display: block; }
  footer {
    margin-top: 14px; text-align: center; color: #7e93a8; font-size: 12.5px; letter-spacing: .08em;
  }
  footer code { color: #b9cbdd; background: rgba(255,255,255,.07); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main class="stage">
  <header>
    <h1>鹈鹕骑自行车</h1>
    <p>纯手写 HTML + 内联 SVG + CSS / SMIL 动画 · 零依赖 · 零网络请求</p>
  </header>
  <figure class="card">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="A pelican riding a bicycle along a sunny road"><style>
.wheel{animation:spin 1.2s linear infinite}
.crank{animation:spin 1.2s linear infinite}
.ring{animation:spin 1.2s linear infinite}
.rider{animation:bob .6s ease-in-out infinite}
.rocker{animation:rock 1.2s ease-in-out infinite}
.shadow{animation:squash .6s ease-in-out infinite}
.sf{animation:scrollx 70s linear infinite}
.sm{animation:scrollx 26s linear infinite}
.sn{animation:scrollx 9s linear infinite}
.sd{animation:scrollx .5s linear infinite}
.sp{animation:scrollx .8s linear infinite}
.sfg{animation:scrollx .35s linear infinite}
.c1{animation:drift 85s linear infinite}
.c2{animation:drift 45s linear infinite}
.glide{animation:glide 24s linear infinite}
.flap{animation:flap .4s ease-in-out infinite}
.blink{animation:blink 4.4s linear infinite}
.pouch{animation:pouchsway .6s ease-in-out infinite}
.wing{animation:wingflap 1.2s ease-in-out infinite}
.flag{animation:ripple .5s ease-in-out infinite}
.glow{animation:glowp 5s ease-in-out infinite}
.rays{animation:spin 90s linear infinite}
.zip1{animation:zip .5s linear infinite}
.zip2{animation:zip .68s linear infinite}
.zip3{animation:zip .44s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes rock{0%,100%{transform:translate(640px,320px) rotate(-.5deg) translate(-640px,-320px)}50%{transform:translate(640px,320px) rotate(.7deg) translate(-640px,-320px)}}
@keyframes squash{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.9)}}
@keyframes scrollx{from{transform:translateX(0)}to{transform:translateX(-1280px)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(1900px)}}
@keyframes glide{0%{transform:translate(-140px,190px)}50%{transform:translate(760px,150px)}100%{transform:translate(1370px,200px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
@keyframes blink{0%,90%,100%{transform:scaleY(0)}93%,96%{transform:scaleY(1)}}
@keyframes pouchsway{0%,100%{transform:translate(200px,88px) skewX(0deg) translate(-200px,-88px)}50%{transform:translate(200px,88px) skewX(-3deg) translate(-200px,-88px)}}
@keyframes wingflap{0%,100%{transform:translate(140px,108px) rotate(0deg) translate(-140px,-108px)}50%{transform:translate(140px,108px) rotate(3.5deg) translate(-140px,-108px)}}
@keyframes ripple{0%,100%{transform:translate(78px,112px) skewY(0deg) translate(-78px,-112px)}50%{transform:translate(78px,112px) skewY(7deg) translate(-78px,-112px)}}
@keyframes glowp{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.6;transform:scale(1.07)}}
@keyframes zip{0%{opacity:0;transform:translateX(0)}25%{opacity:.75}100%{opacity:0;transform:translateX(-80px)}}
